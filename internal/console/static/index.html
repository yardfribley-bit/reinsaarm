<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReinsAARM 控制台</title>
<style>
  :root {
    --bg: #0E1014;
    --side: #0B0C0F;
    --line: #1C2128;
    --line2: #2A3038;
    --gold: #C9A227;
    --text: #E7E4DA;
    --muted: #8B918A;
    --deny: #F07178;
    --deny-bg: #3A1A1C;
    --allow: #5BD38A;
    --allow-bg: #12301F;
    --step: #E8B84A;
    --step-bg: #2E250C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 "Noto Sans CJK SC", "Noto Sans SC", Inter, "Segoe UI", "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .field { background: #0b0c0f; border: 1px solid var(--line2); border-radius: 8px; padding: 7px 10px; width: 100%; }
  textarea.field { min-height: 64px; resize: vertical; }
  .simgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .simout { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .simout dl { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; margin: 8px 0 0; }
  .simout dt { color: var(--muted); }
  .simout dd { margin: 0; }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100%; }
  aside { position: sticky; top: 0; height: 100vh; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px; }
  .brand { padding: 6px 10px 18px; }
  .brand b { color: var(--gold); letter-spacing: 0.08em; font-size: 15px; }
  .brand span { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
  nav button { width: 100%; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 10px 12px; color: var(--muted); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  nav button.active, nav button:hover { background: #14181d; color: var(--text); }
  nav button.active { box-shadow: inset 2px 0 0 var(--gold); }
  .badge { background: var(--gold); color: #1a1403; border-radius: 99px; min-width: 18px; padding: 0 6px; font-size: 11px; font-weight: 700; }
  .foot { margin-top: auto; padding: 12px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  .foot strong { color: var(--text); font-weight: 600; }
  .foot .fr { display: flex; justify-content: space-between; gap: 8px; margin-top: 3px; }
  .foot strong.oktext { color: var(--allow); } .foot strong.badtext { color: var(--deny); }
  .pill { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--allow); flex-shrink: 0; }
  .pill.bad .dot { background: var(--deny); }
  main { display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; gap: 8px; align-items: center; padding: 14px 22px; border-bottom: 1px solid var(--line); }
  .pill { border: 1px solid var(--line2); border-radius: 99px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
  .pill.ok { color: var(--allow); border-color: #1d4a32; background: #10261a; }
  .pill.bad { color: var(--deny); border-color: #6a3034; background: var(--deny-bg); }
  .content { padding: 22px; display: grid; grid-template-columns: 1fr 320px; gap: 18px; }
  .content.single { grid-template-columns: 1fr; }
  h1 { font-size: 20px; margin: 0 0 12px; font-weight: 600; }
  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .filters button, .btn { background: #14181d; border: 1px solid var(--line2); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .filters button.on { border-color: var(--gold); color: var(--gold); }
  .btn.gold { background: var(--gold); color: #1a1403; border-color: var(--gold); font-weight: 650; }
  .btn.danger { background: var(--deny-bg); color: var(--deny); border-color: #6a3034; }
  .btn.ghost { background: transparent; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 8px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .mono { font-family: "IBM Plex Mono", "Noto Sans Mono CJK SC", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  .chip { display: inline-block; border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; }
  .chip.DENY { color: var(--deny); background: var(--deny-bg); }
  .chip.ALLOW { color: var(--allow); background: var(--allow-bg); }
  .chip.STEP_UP, .chip.DEFER { color: var(--step); background: var(--step-bg); }
  .arrow { color: var(--muted); margin: 0 4px; }
  .card, .panel { background: #12151a; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .banner { background: var(--deny-bg); border: 1px solid #6a3034; color: #ffd7d9; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .banner h2 { margin: 0 0 6px; color: var(--deny); font-size: 16px; }
  .row-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(420px, 100%); background: #12151a; border-left: 1px solid var(--line2); padding: 22px; box-shadow: -20px 0 40px #0008; overflow: auto; }
  .muted { color: var(--muted); }
  pre.yaml { white-space: pre-wrap; background: #0b0c0f; border: 1px solid var(--line); border-radius: 8px; padding: 12px; max-height: 360px; overflow: auto; }
  .oktext { color: var(--allow); }
  pre.diff { white-space: pre-wrap; background: #0b0c0f; border: 1px solid var(--line); border-radius: 8px; padding: 12px; max-height: 320px; overflow: auto; margin: 8px 0; }
  pre.diff .add { color: var(--allow); background: var(--allow-bg); display: block; }
  pre.diff .del { color: var(--deny); background: var(--deny-bg); display: block; }
  pre.diff .ctx { display: block; }
  .confirm { border: 1px solid #4A3B14; border-radius: 10px; padding: 12px; margin-top: 10px; background: #15130d; }
  table.rules td { vertical-align: middle; }
  .badtext { color: var(--deny); }
  .timeline { border-left: 2px solid var(--line2); margin-left: 10px; padding-left: 16px; }
  .tl { margin: 0 0 16px; position: relative; }
  .tl:before { content: ""; position: absolute; left: -21px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
  a { color: var(--gold); }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #12151a; }
  .tl.prompt:before { background: #6aa9ff; }
  .tl.stop:before, .tl.end:before { background: var(--muted); }
  .tl.fail:before { background: var(--deny); }
  .tl .res { margin-top: 4px; }
  .tl pre.out { white-space: pre-wrap; word-break: break-all; background: #0b0c0f; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0 0; max-height: 160px; overflow: auto; }
  .tl .ptext { background: #10161f; border: 1px solid #1f2b3a; border-radius: 8px; padding: 8px 10px; margin-top: 6px; white-space: pre-wrap; }
  /* ---- Task replay (sessions) ---- */
  :root { --card: #12151A; --blue: #6AA9FF; --blue-bg: #10161F; --blue-line: #1F2B3A; }
  .rp .lead { color: var(--muted); font-size: 13px; margin: 0 0 16px; max-width: 820px; }
  .rp h1 { letter-spacing: -0.01em; margin: 0 0 8px; }
  .rp .filters { flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .rp .filters .sep { width: 1px; height: 18px; background: var(--line2); margin: 0 4px; }
  .rp .filters button { font-size: 13px; color: var(--text); }
  .rp .filters button.on { color: var(--gold); }
  .rp .btn { font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: var(--text); white-space: nowrap; }
  .rp .btn.gold { color: #1A1403; }
  .rp .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; line-height: 18px; letter-spacing: 0.02em; white-space: nowrap; }
  .chip.fail { color: var(--deny); background: var(--deny-bg); }
  .chip.risk, .chip.out { color: var(--step); background: var(--step-bg); }
  .chip.rule { color: #D7B56A; background: #2A2412; }
  .chip.src { color: #C5CAD3; background: #1A1D23; border: 1px solid var(--line2); font-weight: 600; }
  .chip.src.auto { color: var(--step); background: var(--step-bg); border-color: #4A3B14; }
  .chip.src.unknown { color: var(--muted); font-weight: 500; }
  .chip.status { font-weight: 650; }
  .chip.status.done { color: var(--muted); background: #171A1F; }
  .chip.status.turn { color: #C5CAD3; background: #1A1D23; border: 1px solid var(--line2); }
  .chip.status.live { color: var(--allow); background: var(--allow-bg); }
  .chip.status.warnst { color: var(--step); background: var(--step-bg); }
  .chip.kind { color: #9AA8BC; background: #151A22; font-weight: 600; letter-spacing: 0.04em; }
  .stats-line { display: flex; gap: 16px; margin: 0 0 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .stats-line b { color: var(--text); font-weight: 600; }
  .list-head, .srow { display: grid; grid-template-columns: 148px minmax(0,1fr) 56px 100px 86px; gap: 16px; align-items: start; }
  .list-head { padding: 0 14px 8px; color: var(--muted); font-size: 12px; font-weight: 500; border-bottom: 1px solid var(--line); }
  .srow { padding: 14px; border-bottom: 1px solid var(--line); align-items: center; cursor: pointer; }
  .srow:hover { background: #12151A; }
  .agent-cell { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
  .agent-cell .av { margin-top: 1px; }
  .agent-cell .src-wrap { margin-top: 6px; }
  .av { width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; letter-spacing: -0.03em; }
  .av.codex { background: #1A2330; color: #8CB8F0; border: 1px solid #243044; }
  .av.wb { background: #1A2420; color: #7BC49A; border: 1px solid #243830; }
  .av.other { background: #1A1D23; color: #C5CAD3; border: 1px solid var(--line2); }
  .agent-name { font-weight: 600; }
  .agent-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .proj { font-weight: 600; }
  .proj-path { color: var(--muted); font-size: 11px; margin-top: 2px; word-break: break-all; }
  .oneliner { color: var(--text); font-size: 13px; line-height: 1.45; margin-top: 2px; }
  .oneliner .q { color: #D5D1C6; }
  .risks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .srow .stat { font-variant-numeric: tabular-nums; }
  .srow .when { color: var(--muted); font-size: 12px; line-height: 1.4; }
  .srow .when b { display: block; color: var(--text); font-weight: 500; }
  .backrow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .sess-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
  .sess-h h1 { margin: 0; }
  .crumb { color: var(--muted); font-size: 12px; margin: 4px 0 0; word-break: break-all; }
  .crumb.mono { font-size: 11px; }
  .turn-tabs { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .turn-tabs .btn { flex: 1; min-width: 180px; justify-content: flex-start; padding: 8px 12px; text-align: left; background: transparent; }
  .turn-tabs .btn.on { border-color: var(--gold); color: var(--gold); background: #14181D; }
  .turn-tabs select { background: #14181D; border: 1px solid var(--line2); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .task { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 16px; margin-top: 16px; }
  .task.danger-task { border-color: #5A2A2E; }
  .task.live-task { border-color: #1D4A32; }
  .task-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
  .task-meta .dur { color: var(--text); font-weight: 600; }
  .prompt-box { background: var(--blue-bg); border: 1px solid var(--blue-line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; }
  .prompt-box .plabel { font-size: 11px; color: #7A93B5; margin-bottom: 4px; font-weight: 600; }
  .prompt-box .pbody { font-size: 14px; line-height: 1.55; color: #E7E4DA; }
  .prompt-box .pbody.small { font-size: 13px; }
  .summary { margin: 12px 0 0; font-size: 13px; color: #D5D1C6; padding: 10px 12px; background: #161A20; border-radius: 8px; border: 1px solid var(--line); line-height: 1.55; }
  .summary strong { font-weight: 650; color: var(--text); }
  .compare { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .cmp { padding: 14px 16px; min-width: 0; }
  .cmp.left { background: #0F1115; border-right: 1px solid var(--line); }
  .cmp.right { background: #141820; }
  .cmp h3 { font-size: 12px; font-weight: 650; letter-spacing: 0.02em; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .cmp.left h3 { color: #8B918A; }
  .cmp.right h3 { color: var(--gold); }
  .cmp ul { margin: 0; padding: 0; list-style: none; }
  .cmp li { font-size: 12.5px; line-height: 1.55; padding: 3px 0; color: #C9C6BB; word-break: break-word; }
  .cmp li::before { content: "·"; color: var(--muted); margin-right: 8px; }
  .cmp .missing { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line2); }
  .cmp .missing .ml { font-size: 11px; color: var(--muted); font-weight: 650; margin-bottom: 4px; }
  .cmp .act { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; font-size: 12.5px; line-height: 1.5; }
  .cmp .act .n { flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; background: #1C2633; color: #8CB8F0; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .cmp .act .t { min-width: 0; word-break: break-word; }
  .gantt-wrap { margin-top: 16px; }
  .gantt-title { font-size: 12px; color: var(--muted); font-weight: 650; margin-bottom: 8px; }
  .gantt { background: #0B0C0F; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; }
  .gantt-scale { position: relative; height: 16px; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .gantt-scale span { position: absolute; top: 0; white-space: nowrap; }
  .gantt-track { position: relative; height: 36px; background: #14181D; border-radius: 5px; }
  .gantt-bar { position: absolute; top: 6px; height: 24px; border-radius: 4px; font-size: 11px; display: flex; align-items: center; padding: 0 8px; overflow: hidden; white-space: nowrap; color: #C5CAD3; line-height: 24px; min-width: 3px; }
  .gantt-bar.think { background: #1C2128; color: #7A818C; border: 1px dashed #2A3038; }
  .gantt-bar.mcp { background: #1A2838; color: #9EC0EA; border: 1px solid #2A3F55; }
  .gantt-bar.read { background: var(--step-bg); color: var(--step); border: 1px solid #5A4A18; z-index: 2; }
  .gantt-bar.tool { background: #1A2420; color: #7BC49A; border: 1px solid #243830; }
  .gantt-bar.failbar { background: var(--deny-bg); color: var(--deny); border: 1px solid #6A3034; z-index: 2; }
  .gantt-bar.compose { background: #1A1D23; color: #8B918A; border: 1px solid #2A3038; }
  .gantt-bar.live { background: var(--allow-bg); border: 1px solid #1D4A32; }
  .gantt-ticks { position: relative; height: 20px; margin: 6px 0 2px; }
  .gantt-ticks span { position: absolute; top: 0; transform: translateX(-50%); font-size: 10px; line-height: 16px; color: var(--muted); white-space: nowrap; }
  .gantt-legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); flex-wrap: wrap; margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--line); }
  .gantt-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .steps { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .step { border: 1px solid var(--line); border-radius: 10px; background: #101318; overflow: hidden; }
  .step.open { background: #12161C; }
  .step.risk-step { border-color: #5A4A18; }
  .step.fail-step { border-color: #6A3034; background: #161012; }
  .step.live-step { border-color: #1D4A32; }
  .step.selected { outline: 1px solid var(--gold); outline-offset: -1px; }
  .step-h { display: grid; grid-template-columns: 18px 64px 52px minmax(0,1fr) auto auto; gap: 8px; align-items: center; padding: 9px 12px; font-size: 13px; cursor: pointer; }
  .step-h .desc { min-width: 0; overflow-wrap: anywhere; }
  .step-h .chips { display: inline-flex; gap: 6px; }
  .caret { color: var(--muted); font-size: 10px; }
  .step-time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .step-body { padding: 0 12px 12px 38px; }
  .kv { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 6px 12px; font-size: 12.5px; margin: 0; }
  .kv dt { color: var(--muted); padding-top: 2px; }
  .kv dd { min-width: 0; word-break: break-word; margin: 0; }
  pre.code { white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; background: #0B0C0F; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0; font-family: "IBM Plex Mono", "Noto Sans Mono CJK SC", ui-monospace, Menlo, monospace; font-size: 11.5px; line-height: 1.5; color: #D5D1C6; max-height: 320px; overflow: auto; }
  pre.code.bad { color: var(--deny); }
  .result-preview { background: #0B0C0F; border: 1px dashed #3A3420; border-radius: 8px; padding: 8px 10px; }
  .result-preview .rl { font-size: 12px; padding: 3px 0; color: #C5CAD3; overflow-wrap: anywhere; }
  .result-preview .rl span { color: var(--muted); margin-left: 8px; font-size: 11px; }
  .empty { color: var(--muted); font-size: 12px; }
  .untrusted-note { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: #16130C; border: 1px solid #3A3420; font-size: 12.5px; color: #E2D3A0; line-height: 1.5; }
  .untrusted-note.badnote { background: #2A1416; border-color: #6A3034; color: #FFD7D9; }
  .gap-note { display: flex; align-items: center; gap: 10px; padding: 8px 12px; color: var(--muted); font-size: 12px; border: 1px dashed var(--line2); border-radius: 8px; background: #0F1114; }
  .cover-box { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: #101318; border: 1px dashed var(--line2); color: var(--muted); font-size: 12.5px; line-height: 1.6; }
  .cover-box b { color: #A8AEB0; font-weight: 650; }
  .cover-box ul { margin: 6px 0 0; padding: 0; list-style: none; }
  .final-box { border: 1px solid var(--line); border-radius: 10px; background: #101318; }
  .final-h { padding: 10px 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .final-preview { padding: 0 12px 12px 38px; color: #C9C6BB; font-size: 13px; line-height: 1.6; word-break: break-word; }
  .final-preview .more { color: var(--gold); font-size: 12px; margin-top: 6px; cursor: pointer; white-space: normal; }
  .rp .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .rp .actions .audit { margin-left: auto; font-size: 12px; color: var(--muted); cursor: pointer; }
  .rp .actions .audit .ok { font-weight: 650; color: var(--allow); }
  .rp .actions .audit .bad { font-weight: 650; color: var(--deny); }
  .sdrawer { position: fixed; top: 0; right: 0; height: 100%; width: 420px; background: #12151A; border-left: 1px solid var(--line2); box-shadow: -20px 0 40px #0008; padding: 22px 20px 24px; overflow: auto; z-index: 20; }
  .sdrawer h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .drawer-h { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
  .sdrawer .why { background: var(--step-bg); border: 1px solid #5A4A18; border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 1.55; color: #E2D3A0; margin: 12px 0; }
  .sdrawer .why b { color: var(--step); display: block; margin-bottom: 4px; }
  .sdrawer .why.deny { background: var(--deny-bg); border-color: #6A3034; color: #FFD7D9; }
  .sdrawer .why.deny b { color: var(--deny); }
  .sdrawer .why.plain { background: #14181D; border-color: var(--line2); color: #C9C6BB; }
  .sdrawer .why.plain b { color: var(--text); }
  .dsec { margin-top: 12px; }
  .dsec h3 { font-size: 11px; color: var(--muted); font-weight: 650; letter-spacing: 0.04em; margin: 0 0 6px; }
  .receipt { font-size: 12px; color: var(--muted); line-height: 1.6; }

<body>
<div class="app">
  <aside>
    <div class="brand"><b>REINSAARM</b><span>运行时安全</span></div>
    <nav>
      <button data-page="stream" class="active">实时流</button>
      <button data-page="sessions">会话</button>
      <button data-page="approvals">审批 <span class="badge" id="nav-badge" hidden>0</span></button>

      <div class="fr"><span>审计校验</span><strong id="foot-audit">—</strong></div>
    </div>
  </aside>
  <main>
    <header>
      <span class="pill" id="pill-side">sidecar</span>
      <span class="pill" id="pill-hook">钩子</span>

    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<script>
const $ = (s, r=document) => r.querySelector(s);
const view = $("#view");
let page = "stream";
let openId = "";
function readHash() {
  const parts = (location.hash.replace(/^#\/?/, "") || "stream").split("/");
  page = parts[0] || "stream";
  openId = parts[1] || "";
  turnSel = Number(parts[2] || 0) || 0;
  if (page === "sessions" && parts[3]) drawerSeq = Number(parts[3]) || 0;
}
readHash();
let filter = "all";
let newRule = null;
let boot = {};
let receipts = [];
let approvals = {pending: [], resolved: []};
let drawer = null;
let rendered = "";
let lastHTML = "";
let sessions = [];
let sessionAgent = "";
let detail = null;
let sim = {kind: "shell", agent: "", main: "", server: "", tool: "", args: "", result: null, error: ""};

function agentName(c) {
  const m = {codex:"Codex", "claude-code":"Claude Code", gemini:"Gemini", codebuddy:"CodeBuddy", workbuddy:"WorkBuddy", reinsaarm:"系统", sensor:"系统", egress:"系统", demo:"系统"};
  return m[c] || c || "系统";
}
function chip(d) {
  if (!d) return "";
  return `<span class="chip ${d}">${d}</span>`;
}
function chips(rec) {
  if (rec.decision === rec.enforced_decision) return chip(rec.decision);
  return chip(rec.decision) + `<span class="arrow">→</span>` + chip(rec.enforced_decision);
}
function what(r) {
  if (r.command_preview) return r.command_preview;
  const res = r.resources || {};
  const bits = [r.tool];
  if (res.mcp_server || res.mcp_tool) bits.push(`${res.mcp_server || "?"}/${res.mcp_tool || "?"}`);
  if ((res.paths||[]).length) bits.push(res.paths.slice(0, 3).join(" "));
  if ((res.hosts||[]).length) bits.push(res.hosts.slice(0, 3).join(" "));
  return bits.filter(Boolean).join(" · ");
}
function kindTag(r) {
  return r.kind && r.kind !== "shell" ? `<span class="muted mono">[${esc(r.kind)}]</span> ` : "";
}
function when(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  if (Number.isNaN(d.getTime())) return ts;
  return d.toLocaleTimeString("zh-CN", {hour12:false});
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
}

async function api(path, opt) {
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function refresh() {
  boot = await api("/api/bootstrap");
  const badge = $("#nav-badge");
  badge.hidden = !boot.pending;
  badge.textContent = boot.pending || "";
  $("#foot-side").textContent = boot.sidecar === "running" ? "运行中" : "未连接";
  $("#foot-side").className = boot.sidecar === "running" ? "oktext" : "badtext";
  $("#foot-audit").className = boot.audit_ok ? "oktext" : "badtext";
  $("#foot-lat").textContent = boot.latency_p50_us ? (boot.latency_p50_us/1000).toFixed(1) + " ms" : "—";
  $("#foot-audit").textContent = boot.audit_ok ? "通过" : "未通过";
  setPill($("#pill-side"), boot.sidecar === "running", "sidecar 运行中", "sidecar 未连接");
  setPill($("#pill-hook"), boot.hook_trust === "trusted", "钩子已信任", "钩子未信任");
  setPill($("#pill-proj"), boot.project_trust === "trusted", "项目已信任", "项目未信任");
  if (page === "stream" || page === "audit") {
    const q = page === "stream" ? filter : "all";
    const m = page === "audit" && /^(\d+)-(\d+)$/.exec(openId);
    receipts = (await api("/api/receipts?filter=" + encodeURIComponent(q) + (m ? `&from=${m[1]}&to=${m[2]}` : ""))).receipts || [];
    if (m) await loadChain(false);
  }
  if (page === "sessions") {
    if (openId) {
      try { detail = await api("/api/sessions/" + encodeURIComponent(decodeURIComponent(openId))); }
      catch (e) { detail = {error: String(e.message || e)}; }
      await loadChain(false);
    } else {
      detail = null;
      sessions = (await api("/api/sessions")).sessions || [];
    }
  }
  if (page === "stream" || page === "approvals") {
    approvals = await api("/api/approvals");
    if (openId) drawer = (approvals.pending || []).find(g => g.id === openId) || drawer;
  }
  render();
}
function setPill(el, ok, yes, no) {
  el.className = "pill " + (ok ? "ok" : "bad");
  el.innerHTML = `<span class="dot"></span>${esc(ok ? yes : no)}`;
}
function banner() {
  if (!boot.untrusted) return "";
  return `<div class="banner"><h2>钩子未被信任，拦截未生效</h2>
    <p>Codex 在钩子或项目未信任时不会加载项目 <span class="mono">.codex/hooks.json</span>。</p>
    <p class="mono">${esc(boot.fix_command)}</p>
    <p class="mono">${esc(boot.hook_key || "")}</p>
    <div class="row-actions">
      <button class="btn gold" id="copy-fix">复制修复命令</button>
      <button class="btn" data-page-jump="health">查看健康检查</button>
    </div></div>`;
}

function render() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.page === page));
  // The policy page holds a form; the 2 s refresh must not wipe what is typed.
  if (page === "policy" && rendered === "policy") return;
  rendered = page;
  view.className = "content" + (page === "stream" ? "" : " single");
  if (page === "stream") view.innerHTML = streamHTML();
  else if (page === "sessions") {
    const html = openId ? sessionDetailHTML() : sessionsHTML();
    if (html !== lastHTML) { view.innerHTML = html; lastHTML = html; }
    bind();
    return;
  }
  else if (page === "approvals") view.innerHTML = approvalsHTML();
  else if (page === "audit") view.innerHTML = auditHTML();
  else if (page === "policy") view.innerHTML = `<h1>策略</h1>${openId === "new-mcp-rule" ? newRuleHTML() : ""}${simHTML()}<div id="policy">加载中…</div>`;
  else view.innerHTML = `<h1>健康检查</h1><div id="health">加载中…</div>`;
  lastHTML = "";
  bind();
  if (page === "policy") { bindSim(); bindNewRule(); loadPolicy(); if (openId === "sim" && sim.main) runSim(); }
  if (page === "health") loadHealth();
}
function streamHTML() {
  const rows = receipts.map(r => `<tr>
    <td class="mono muted">${esc(when(r.ts))}</td>
    <td>${esc(agentName(r.client))}</td>
    <td class="mono">${kindTag(r)}${esc(what(r))}</td>
    <td>${esc(r.reason || "")}</td>
    <td>${chips(r)}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">还没有决定。</td></tr>`;
  const cards = (approvals.pending || []).map(card).join("") || `<p class="muted">没有待审批。</p>`;
  const done = (approvals.resolved || []).slice(-4).reverse().map(g => `<div class="card"><div class="mono">${esc(g.id)}</div><div class="muted">${g.denied ? "已拒绝" : "已处理"}</div></div>`).join("");
  return `<section><h1>实时流</h1>${banner()}
    <div class="filters">
      ${["all:全部","deny:拒绝","step:需审批","allow:放行"].map(x => {
        const [id, label] = x.split(":");
        return `<button data-filter="${id}" class="${filter===id?"on":""}">${label}</button>`;
      }).join("")}
    </div>
    <table><thead><tr><th>时间</th><th>Agent</th><th>命令</th><th>原因</th><th>策略 → 执行</th></tr></thead><tbody>${rows}</tbody></table>
    </section><aside><h1>待审批</h1>${cards}<h1 style="margin-top:18px;font-size:16px">最近处理</h1>${done}</aside>`;
}
function whenFull(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  if (Number.isNaN(d.getTime())) return ts;
  return d.toLocaleString("zh-CN", {hour12:false, month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit"});
}
// ---- Task replay (会话) ----
let sessRisky = false;
let sessRange = "today";
var turnSel = turnSel || 0; // 1-based turn index from the hash; 0 = latest
var drawerSeq = drawerSeq || 0; // step shown in the side drawer
let openSteps = {};       // seq -> true/false, user toggles
let finalOpen = false;
let chain = null;         // {ok, count}
let chainAt = 0;
const TZ = (Intl.DateTimeFormat().resolvedOptions().timeZone) || "本地时间";

function hhmmss(ts) { return when(ts); }
function hhmm(ts) { const s = when(ts); return s.slice(0, 5); }
function mmdd(ts) {
  const d = new Date(ts); if (Number.isNaN(d.getTime())) return "";
  return String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0");
}
function startLabel(ts) {
  const d = new Date(ts); if (Number.isNaN(d.getTime())) return "";
  return mmdd(ts) + " " + hhmmss(ts);
}
function dur(ms) {
  if (ms === undefined || ms === null) return "";
  if (ms < 1000) return ms + "ms";
  const s = Math.floor(ms / 1000);
  if (s < 10) return (ms / 1000).toFixed(1) + "s";
  if (s < 60) return s + "秒";
  if (s < 3600) return Math.floor(s / 60) + "分" + (s % 60) + "秒";
  return Math.floor(s / 3600) + "时" + Math.floor(s / 60) % 60 + "分";
}
function durSpaced(ms) { return dur(ms).replace(/(\d)([分秒时])/g, "$1 $2 ").replace(/\s+$/, ""); }
function avatar(c) {
  if (c === "codex") return `<div class="av codex">C</div>`;
  if (c === "workbuddy") return `<div class="av wb">W</div>`;
  return `<div class="av other">${esc((agentName(c) || "?").slice(0, 2))}</div>`;
}
function srcChip(code, label, long) {
  if (!code || code === "unknown") return `<span class="chip src unknown">${esc(label || "来源未记录")}</span>`;
  if (code === "automation") return `<span class="chip src auto">${long ? "自动化任务（非人工下发）" : "自动化任务"}</span>`;
  return `<span class="chip src">${esc(label)}</span>`;
}
function riskChip(r, inTurn) {
  const cls = {deny: "DENY", fail: "fail", outside_read: "out", outside_write: "out", outside_path: "out", no_rule_mcp: "rule", credential: "DENY", egress: "risk", untrusted_then_sensitive: "risk"}[r.code] || "risk";
  let label = r.label;
  if (r.code === "fail" || r.code === "deny") { if (inTurn) label += " " + r.count; }
  else if (r.count > 1 && (r.code === "no_rule_mcp" || r.code === "egress" || r.code === "untrusted_then_sensitive")) label += " ×" + r.count;

}
function statusChip(st) {
  if (st === "running") return `<span class="chip status live">进行中</span>`;
  if (st === "turn_done" || st === "done") return `<span class="chip status turn">本轮结束</span>`;
  if (st === "no_stop") return `<span class="chip status warnst">未收到 Stop</span>`;
  if (st === "idle") return `<span class="chip status warnst">30 分钟无活动</span>`;
  if (st === "decisions_only") return `<span class="chip status done">仅执行前决定</span>`;
  return `<span class="chip status done">已结束</span>`;
}
function homeShort(p) { return String(p || ""); }
function inRange(ts) {
  if (sessRange === "all") return true;
  const d = new Date(ts); if (Number.isNaN(d.getTime())) return true;
  const now = new Date();
  if (sessRange === "today") return d.toDateString() === now.toDateString();
  return now - d <= 7 * 86400000;
}

function sessionsHTML() {
  const agents = [...new Set(["codex", "workbuddy", ...sessions.map(x => x.client)])];
  const timeList = sessions.filter(x => inRange(x.last_ts));
  const list = timeList.filter(x => (!sessionAgent || x.client === sessionAgent) && (!sessRisky || x.risky));
  const risky = list.filter(x => x.risky);
  const labels = [...new Set(risky.flatMap(x => (x.risks || []).map(r => r.label.replace(/ MCP$/, " MCP"))))];

        <div class="oneliner"><span class="q">${esc(x.latest_title || "（没有用户提示）")}</span></div>
        ${(x.risks || []).length ? `<div class="risks">${x.risks.map(r => riskChip(r, false)).join("")}</div>` : ""}

    </div>`).join("") || `<p class="muted" style="padding:14px">${sessions.length ? "这个筛选下没有会话。" : "还没有会话。安装活动事件后（reinsaarm install-hooks codex --trust 或 workbuddy），新会话会出现在这里。"}</p>`;

    <p class="lead">按「一轮任务」查看 Agent 实际做了什么。列表标出 Agent 界面里不会出现的越界读取、无规则放行和失败。</p>
    <div class="filters">
      ${btn("data-sagent", "", !sessionAgent, "全部")}
      ${agents.map(a => btn("data-sagent", a, sessionAgent === a, agentName(a))).join("")}
      <span class="sep"></span>
      ${btn("data-srisky", "1", sessRisky, "有风险")}
      <span class="sep"></span>
      ${btn("data-srange", "today", sessRange === "today", "今天")}
      ${btn("data-srange", "7d", sessRange === "7d", "近 7 天")}
      ${btn("data-srange", "all", sessRange === "all", "全部时间")}
    </div>
    <div class="stats-line">
      <span>${rangeName} <b>${list.length}</b> 个会话</span>
      <span>其中 <b>${risky.length}</b> 个有风险${labels.length ? "（" + esc(labels.join("、")) + "）" : ""}</span>
      <span>时间均为 <b>${esc(TZ)}</b></span>
    </div>
    <div class="list-head"><div>Agent / 来源</div><div>项目 / 最近一轮任务</div><div>任务</div><div>状态</div><div>最近活动</div></div>
    ${rows}</section>`;
}

function curTurn() {
  const turns = (detail && detail.turns) || [];
  if (!turns.length) return null;
  const i = turnSel >= 1 && turnSel <= turns.length ? turnSel : turns.length;
  return turns[i - 1];
}
function kindChip(st) {
  const m = {web: "MCP", mcp: "MCP", read: "读取", write: "写入", shell: "命令", other: "其他", start: "会话", end: "会话"};
  let k = m[st.category] || "其他";

}
function shortPath(p, keep) {
  const parts = String(p).split("/");
  keep = keep || 5;
  if (parts.length <= keep + 1) return p;
  if (keep <= 3 && parts[1] === "Users" && parts.length > keep + 4) return parts.slice(0, 5).join("/") + "/…/" + parts.slice(-keep + 1).join("/");

function tilde(p) { return String(p).replace(/^\/Users\/[^/]+\//, "~/").replace(/^\/home\/[^/]+\//, "~/"); }
function shortCmd(cmd, st) {

}
function actOf(r) { return (r && r.activity) || {}; }
function fullCmd(st) {

}
function stepDesc(st) {

    else if (st.category === "web") tail = head.kind === "web_fetch" ? " · 访问网页" : " · 搜索网页";
    if (st.running) tail = st.query ? ` · 正在搜索「${esc(st.query)}」` : (st.category === "web" ? " · 正在搜索网页" : " · 进行中");
    return `<span class="mono">${esc(name)}</span>${tail}`;
  }
  const cmd = head.kind === "shell" ? fullCmd(st) : "";
  if (cmd) return `<span class="mono" style="word-break:break-all">${esc(shortCmd(cmd, st))}</span>`;

}
function decChip(st) {
  const d = st.decision;

}
function isOpen(st, t) {
  if (st.seq in openSteps) return openSteps[st.seq];
  if (st.running || st.failed || st.denied || st.outside || st.after_untrusted || st.credential) return true;

  return `${esc(d.reason || "")} <span class="mono">${esc(ids.join(", "))}</span>`;
}
function linksHTML(links) {
  return `<div class="result-preview">${links.map(l => `<div class="rl mono">${esc(l.url).replace(/\//g, "/<wbr>")}${l.title ? ` <span>${esc(l.title)}</span>` : ""}</div>`).join("")}</div>`;
}
function resultBlock(st) {
  const r = st.result;

  const a = actOf(r);
  const links = st.links || a.result_links || [];
  const out = a.error || a.output || "";

  return `<section><h1>审计链</h1>${range}
    <div class="row-actions"><button class="btn gold" id="verify">校验整条链</button><span id="verify-out" class="muted"></span></div>
    <div class="timeline">${items}</div></section>`;
}
function ruleYAML(r) {
  const id = "mcp-" + (r.server || "any").replace(/[^a-z0-9]+/gi, "-").toLowerCase() + "-" + (r.tool || "any").replace(/\*/g, "all").replace(/[^a-z0-9]+/gi, "-").replace(/-+$/, "").toLowerCase();
  return `spec:\n  mcp:\n    rules:\n      - id: ${id}\n        server: ${r.server || '"*"'}\n        tool: "${r.tool || "*"}"\n        decision: ${r.decision}\n        reason: ${JSON.stringify(r.reason || "")}`;
}
function newRuleHTML() {
  if (!newRule) newRule = {server: "", tool: "", decision: "STEP_UP", reason: ""};
  const r = newRule;
  const opt = v => `<option value="${v}" ${r.decision === v ? "selected" : ""}>${v}</option>`;
  return `<div class="card policy-new" id="newrule"><h2>新建 MCP 规则</h2>
    <p class="muted">按服务名和工具名（支持 * 通配）匹配 MCP 调用。已从任务回放预填。</p>
    <div class="simgrid">
      <input class="field mono" id="nr-server" value="${esc(r.server)}" placeholder="server，例如 codex_apps">
      <input class="field mono" id="nr-tool" value="${esc(r.tool)}" placeholder="tool，例如 search_service__*">
      <select class="field" id="nr-decision">${["ALLOW", "STEP_UP", "DENY"].map(opt).join("")}</select>
    </div>
    <input class="field" id="nr-reason" value="${esc(r.reason)}" placeholder="原因（写进回执）">
    <p class="muted" style="margin:10px 0 6px">「保存并生效」会先给你看对 profile.yaml 的改动，确认后写入 <span class="mono">spec.mcp.rules</span>（自动备份原文件，并在审计链记一条 <span class="mono">policy.changed</span>）；sidecar 在下一次工具调用前自动重新加载，不用重启。也可以复制 YAML 自己合并。</p>
    <pre class="yaml mono" id="nr-yaml">${esc(ruleYAML(r))}</pre>
    <div class="row-actions"><button class="btn gold" id="nr-save">保存并生效</button><button class="btn" id="nr-copy">复制 YAML</button><button class="btn" id="nr-sim">用模拟执行测试当前策略</button><span class="muted" id="nr-note"></span></div>
    <div id="nr-confirm"></div></div>`;
}
function bindNewRule() {
  const box = $("#newrule");
  if (!box) return;
  const upd = () => {
    newRule = {server: $("#nr-server").value.trim(), tool: $("#nr-tool").value.trim(), decision: $("#nr-decision").value, reason: $("#nr-reason").value};
    $("#nr-yaml").textContent = ruleYAML(newRule);
  };
  ["#nr-server", "#nr-tool", "#nr-reason"].forEach(id => $(id).oninput = upd);
  $("#nr-decision").onchange = upd;
  $("#nr-copy").onclick = async () => { try { await navigator.clipboard.writeText(ruleYAML(newRule)); $("#nr-note").textContent = "已复制"; } catch (_) { $("#nr-note").textContent = "复制失败，请手动选中"; } };
  $("#nr-sim").onclick = () => { sim.kind = "mcp"; if (!sim.server) sim.server = newRule.server; if (!sim.tool) sim.tool = newRule.tool.replace(/\*$/, ""); redrawSim(); runSim(); };
  $("#nr-save").onclick = async () => {
    upd();
    const body = {op: "add", server: newRule.server, tool: newRule.tool, decision: newRule.decision, reason: newRule.reason};
    await previewRuleChange(body, $("#nr-confirm"), $("#nr-note"), (res) => {
      $("#nr-note").innerHTML = `<span class="oktext">已保存并生效</span>：规则 <span class="mono">${esc(res.rule.id)}</span>，审计回执 #${esc(res.receipt_seq)}，备份 <span class="mono">${esc(res.backup)}</span>`;
      sim.kind = "mcp"; sim.server = newRule.server; sim.tool = newRule.tool.replace(/\*/g, "x").replace(/\?/g, "x"); sim.args = "";
      redrawSim(); runSim();
    });
  };
}
async function postRule(body) {
  const r = await fetch("/api/policy/mcp-rules", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const txt = await r.text();
  let j = {};
  try { j = JSON.parse(txt); } catch (_) { j = {error: txt}; }
  if (!r.ok) throw new Error(j.error || txt);
  return j;
}
function diffHTML(d) {
  return `<pre class="diff mono">${(d || "").split("\n").filter(l => l !== "").map(l => `<span class="${l[0] === "+" ? "add" : l[0] === "-" ? "del" : "ctx"}">${esc(l)}</span>`).join("")}</pre>`;
}
// previewRuleChange dry-runs an add or remove, shows the diff, and on
// confirmation writes exactly that diff (the server checks base_version).
async function previewRuleChange(body, box, note, onDone) {
  note.textContent = "";
  let prev;
  try { prev = await postRule({...body, dry_run: true}); }
  catch (e) { box.innerHTML = ""; note.innerHTML = `<span class="badtext">${esc(e.message)}</span>`; return; }
  const verb = body.op === "remove" ? "删除" : "写入";
  box.innerHTML = `<div class="confirm"><strong>确认${verb}以下改动？</strong>
    <div class="muted mono" style="margin-top:4px">${esc(prev.path)} · 版本 ${esc(prev.base_version)} → ${esc(prev.version)}</div>
    ${diffHTML(prev.diff)}
    <div class="row-actions"><button class="btn ${body.op === "remove" ? "danger" : "gold"}" data-rc="ok">确认${verb}并生效</button><button class="btn ghost" data-rc="no">取消</button></div></div>`;
  box.querySelector('[data-rc="no"]').onclick = () => { box.innerHTML = ""; };
  box.querySelector('[data-rc="ok"]').onclick = async () => {
    try {
      const res = await postRule({...body, id: prev.rule.id, base_version: prev.base_version});
      box.innerHTML = "";
      await loadPolicy();
      onDone(res);
    } catch (e) { note.innerHTML = `<span class="badtext">${esc(e.message)}</span>`; box.innerHTML = ""; }
  };
}
function mcpRulesHTML(p) {
  const rules = p.mcp_rules || [];
  const rows = rules.map(r => `<tr><td class="mono">${esc(r.id)}</td><td class="mono">${esc(r.server || "*")}</td><td class="mono">${esc(r.tool || "*")}</td><td>${chip(r.decision)}</td><td class="muted">${esc(r.reason || "")}</td>
    <td>${r.removable ? `<button class="btn danger" data-delrule="${esc(r.id)}">删除</button>` : `<span class="muted">手动维护</span>`}</td></tr>`).join("");
  return `<div class="card" id="mcp-rules"><h2>MCP 规则 <span class="muted">${rules.length} 条</span></h2>
    ${rules.length ? `<table class="rules"><tr><th>ID</th><th>server</th><th>tool</th><th>决定</th><th>原因</th><th></th></tr>${rows}</table>` : `<p class="muted">还没有 MCP 规则：所有 MCP 调用都是「无规则放行」（参数命中凭据路径、外联黑名单或投毒描述时除外）。</p>`}
    <div class="row-actions"><button class="btn" id="mr-new">新建 MCP 规则</button><span class="muted" id="mr-note"></span></div><div id="mr-confirm"></div></div>`;
}
function bindMCPRules() {
  const nb = $("#mr-new");
  if (nb) nb.onclick = () => { newRule = null; rendered = ""; location.hash = "#/policy/new-mcp-rule"; };
  document.querySelectorAll("[data-delrule]").forEach(b => b.onclick = () => {
    previewRuleChange({op: "remove", id: b.dataset.delrule}, $("#mr-confirm"), $("#mr-note"), (res) => {
      $("#mr-note").innerHTML = `<span class="oktext">已删除</span> <span class="mono">${esc(res.rule.id)}</span>，审计回执 #${esc(res.receipt_seq)}，备份 <span class="mono">${esc(res.backup)}</span>`;
    });
  });
}
async function loadPolicy() {
  const p = await api("/api/policy");
  $("#policy").innerHTML = mcpRulesHTML(p) + `
    <div class="card"><h2>网络白名单</h2><p class="muted">模式 ${esc(p.network_mode)}</p><p class="mono">${esc((p.allow||[]).join("  "))}</p></div>
    <div class="card"><h2>受保护分支</h2><p>force-push <span class="chip DENY">DENY</span>　普通 push <span class="chip STEP_UP">STEP_UP</span></p><p class="mono">${esc((p.protected_branches||[]).join(" "))}</p></div>
    <div class="card"><h2>凭据路径</h2><p class="mono">${esc((p.credential_prefixes||[]).join("\n"))}</p><p class="muted">允许的文件名 ${(p.allow_basenames||[]).join(", ")}</p></div>
    <div class="card"><h2>适配器</h2><table><tr><th>客户端</th><th>放行</th><th>需审批</th><th>说明</th></tr>
      ${(p.adapters||[]).map(a => `<tr><td>${esc(a.client)}</td><td>${esc(a.allow)}</td><td>${esc(a.step_up)}</td><td class="muted">${esc(a.note)}</td></tr>`).join("")}
    </table></div>
    <h2>remit.yaml</h2><p class="muted mono">${esc(p.path || "")} · 版本 ${esc(p.version || "")}</p><pre class="yaml mono">${esc(p.yaml || "")}</pre>`;
  bindMCPRules();
}
const SIM_KINDS = [
  ["shell", "shell 命令"], ["file_read", "读文件 file_read"], ["file_write", "写文件 file_write"],
  ["file_edit", "改文件 file_edit"], ["web_fetch", "网络请求 web_fetch"], ["mcp", "MCP 调用"],
  ["payload", "原始钩子 JSON"]];
const SIM_AGENTS = [["", "不指定 Agent"], ["codex", "Codex"], ["claude-code", "Claude Code"], ["gemini", "Gemini CLI"], ["codebuddy", "CodeBuddy"], ["workbuddy", "WorkBuddy"]];
function simPlaceholder(k) {
  return {shell: "git push --force origin main", file_read: "~/.ssh/id_rsa", file_write: "src/main.go",
    file_edit: ".github/workflows/ci.yml", web_fetch: "https://example.com/docs", mcp: "", payload: ""}[k] || "";
}
function simHTML() {
  const k = sim.kind;
  const opts = (list, cur) => list.map(([v, l]) => `<option value="${v}" ${v===cur?"selected":""}>${esc(l)}</option>`).join("");
  const showMain = k !== "mcp" && k !== "payload";
  const showArgs = k === "mcp" || k === "payload";
  const argsPh = k === "mcp" ? '参数 JSON，例如 {"path": "~/.aws/credentials"}'
    : 'PreToolUse 钩子 JSON，例如 {"tool_name": "Read", "tool_input": {"file_path": "~/.ssh/id_rsa"}}';
  return `<div class="card" id="sim"><h2>模拟执行</h2>
    <p class="muted">在当前策略下测试一次调用：不执行，不写审计回执，不创建也不消耗审批。</p>
    <div class="simgrid">
      <select class="field" id="sim-kind">${opts(SIM_KINDS, k)}</select>
      <select class="field" id="sim-agent">${opts(SIM_AGENTS, sim.agent)}</select>
    </div>
    ${showMain ? `<input class="field mono" id="sim-main" value="${esc(sim.main)}" placeholder="${esc(simPlaceholder(k))}">` : ""}
    ${k === "mcp" ? `<div class="simgrid"><input class="field mono" id="sim-server" value="${esc(sim.server)}" placeholder="server，例如 filesystem"><input class="field mono" id="sim-tool" value="${esc(sim.tool)}" placeholder="tool，例如 read_file"></div>` : ""}
    ${showArgs ? `<textarea class="field mono" id="sim-args" placeholder="${esc(argsPh)}">${esc(sim.args)}</textarea>` : ""}
    <div class="row-actions"><button class="btn gold" id="sim-run">测试</button></div>
    <div id="sim-out">${simResultHTML()}</div></div>`;
}
function simResultHTML() {
  if (sim.error) return `<div class="simout badtext">${esc(sim.error)}</div>`;
  const r = sim.result;
  if (!r) return "";
  const a = r.action || {};
  let head = chip(r.decision);
  if (r.enforced && r.enforced !== r.decision) head += `<span class="arrow">→</span>` + chip(r.enforced);
  const rows = [
    ["命中规则", `<span class="mono">${esc((r.rule_ids||[]).join(", "))}</span>`],
    ["原因", esc(r.reason || "")],
  ];
  if (r.agent) rows.push([agentName(r.agent), "执行为 " + chip(r.agent_enforced)]);
  if (r.rewrite) rows.push(["改写为", `<span class="mono">${esc(r.rewrite)}</span>`]);
  rows.push(["类型", `<span class="mono">${esc(a.kind)} · ${esc(a.tool)}</span>`]);
  if (a.command) rows.push(["命令", `<span class="mono">${esc(a.command)}</span>`]);
  if ((a.paths||[]).length) rows.push(["路径", `<span class="mono">${esc(a.paths.join(", "))}</span>`]);
  if ((a.hosts||[]).length) rows.push(["主机", `<span class="mono">${esc(a.hosts.join(", "))}</span>`]);
  if ((a.git_ops||[]).length) rows.push(["git", `<span class="mono">${esc(a.git_ops.join(", "))}</span>`]);
  if (a.mcp_server || a.mcp_tool) rows.push(["MCP", `<span class="mono">${esc(a.mcp_server)} / ${esc(a.mcp_tool)}</span>`]);
  rows.push(["策略版本", `<span class="mono">${esc(r.policy_version)}</span> · 模式 ${esc(r.mode)}`]);
  return `<div class="simout">${head}<dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>
    ${(r.notes||[]).map(n => `<p class="muted" style="margin:6px 0 0">${esc(n)}</p>`).join("")}</div>`;
}
function readSim() {
  const v = id => { const el = $("#" + id); return el ? el.value : undefined; };
  ["main", "server", "tool", "args"].forEach(f => { const x = v("sim-" + f); if (x !== undefined) sim[f] = x; });
  sim.agent = v("sim-agent") ?? sim.agent;
}
function redrawSim() {
  const el = $("#sim");
  if (!el) return;
  el.outerHTML = simHTML();
  bindSim();
}
function bindSim() {
  const kind = $("#sim-kind");
  if (!kind) return;
  kind.onchange = () => { readSim(); sim.kind = kind.value; sim.result = null; sim.error = ""; redrawSim(); };
  const main = $("#sim-main");
  if (main) main.onkeydown = e => { if (e.key === "Enter") runSim(); };
  $("#sim-run").onclick = runSim;
}
async function runSim() {
  readSim();
  const body = {agent: sim.agent};
  try {
    if (sim.kind === "payload") body.payload = JSON.parse(sim.args || "{}");
    else if (sim.kind === "shell") body.command = sim.main;
    else if (sim.kind === "web_fetch") { body.kind = "web_fetch"; body.url = sim.main; }
    else if (sim.kind === "mcp") {
      body.kind = "mcp"; body.server = sim.server; body.tool = sim.tool;
      if ((sim.args || "").trim()) body.args = JSON.parse(sim.args);
    } else { body.kind = sim.kind; body.paths = [sim.main]; }
  } catch (e) {
    sim.result = null; sim.error = "JSON 格式错误：" + e.message; redrawSim(); return;
  }
  try {
    const r = await fetch("/api/policy/test", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const txt = await r.text();
    let j = {};
    try { j = JSON.parse(txt); } catch (_) { j = {error: txt}; }
    if (!r.ok) { sim.result = null; sim.error = j.error || txt; }
    else { sim.result = j; sim.error = ""; }
  } catch (e) {
    sim.result = null; sim.error = String(e.message || e);
  }
  redrawSim();
}
async function loadHealth() {
  const h = await api("/api/health");
  $("#health").innerHTML = `<div class="row-actions"><button class="btn" id="rerun">重新检查</button></div>` +
    (h.items||[]).map(it => `<div class="card"><strong>${esc(it.name)}</strong>
      <span class="${it.ok ? "oktext" : "badtext"}">${it.ok ? "通过" : "未通过"}</span>
      <div class="muted mono">${esc(it.detail || "")}</div></div>`).join("");
  $("#rerun").onclick = () => loadHealth();
}
function bind() {
  document.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { filter = b.dataset.filter; refresh(); });
  document.querySelectorAll("[data-page-jump]").forEach(b => b.onclick = () => go(b.dataset.pageJump));
  bindReplay();
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = async (ev) => {
    ev.stopPropagation();
    await api("/api/approvals/" + b.dataset.id + "/" + b.dataset.act, {method:"POST"});
    drawer = null;
    await refresh();
  });
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    drawer = (approvals.pending||[]).find(g => g.id === b.dataset.open) || null;
    render();
  });
  const copy = $("#copy-fix");
  if (copy) copy.onclick = () => navigator.clipboard.writeText(boot.fix_command || "");
  const close = $("#close-drawer");
  if (close) close.onclick = () => { drawer = null; render(); };
  const verify = $("#verify");
  if (verify) verify.onclick = async () => {
    const res = await api("/api/audit/verify", {method:"POST"});
    const el = $("#verify-out");
    el.textContent = res.ok ? `通过，${res.count} 条` : ("未通过 " + (res.error || ""));
    el.className = res.ok ? "oktext" : "badtext";
    boot.audit_ok = !!res.ok;
    $("#foot-audit").textContent = boot.audit_ok ? "通过" : "未通过";
  };
}
function go(p) { page = p; openId = ""; location.hash = "#/" + p; drawer = null; refresh(); }
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  go(b.dataset.page);
});
window.addEventListener("hashchange", () => {
  readHash();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.page === page));
  refresh();
});
refresh();
setInterval(refresh, 2000);
</script>
</body>
